name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# По умолчанию — только чтение; запись нужна лишь джобе публикации релиза
permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tag must match package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в package.json (v$VERSION). Автообновление сравнивает именно их."
            exit 1
          fi
          if [ ! -f electron/update-public-key.pem ]; then
            echo "::error::Нет electron/update-public-key.pem — выполните npm run update-keys (см. README → «Автообновления»)."
            exit 1
          fi

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage rpm deb
          - os: macos-latest
            target: --mac dmg
          - os: windows-latest
            target: --win nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Build Desktop Application (Local Only)
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
            release/*.dmg
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: check-version
    runs-on: ubuntu-latest
    # Ключ подписи APK доступен только в защищённом окружении (см. README)
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Build-Tools 35 and Platform 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35"

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64. Релизный APK без постоянного ключа подписи не собираем (см. README → «Подпись Android»)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "DARKMSAL_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        env:
          DARKMSAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DARKMSAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DARKMSAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "release/DarkMSAL-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk

  build-ios:
    name: Build iOS IPA
    needs: check-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Build iOS Archive & Package IPA
        run: |
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p release/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app release/Payload/
          VERSION=$(node -p "require('./package.json').version")
          cd release && zip -qr -y "DarkMSAL-$VERSION.ipa" Payload && rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: release/*.ipa

  build-userscript:
    name: Build Userscript
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build:userscript

      - name: Upload userscript
        uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: release/darkmsal.user.js

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android, build-ios, build-userscript]
    runs-on: ubuntu-latest
    # Ключ подписи обновлений доступен только в защищённом окружении (см. README)
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather release files
        run: |
          mkdir -p final-release
          find artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.rpm" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" -o -name "*.user.js" -o -name "latest*.yml" -o -name "*.blockmap" \) -exec cp {} final-release/ \;
          ls -lh final-release/

      - name: Release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log --no-merges --pretty='- %s' $RANGE | head -40 > notes.txt
          cat notes.txt

      - name: Manifest, checksums and signature
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Нет секрета UPDATE_SIGNING_KEY в окружении release. Без подписи десктопные клиенты не примут обновление (см. README → «Автообновления»)."
            exit 1
          fi
          node scripts/make-release-manifest.mjs final-release "${{ steps.tag.outputs.tag }}" notes.txt
          (cd final-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          node scripts/sign-release.mjs final-release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DarkMSAL ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: notes.txt
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
